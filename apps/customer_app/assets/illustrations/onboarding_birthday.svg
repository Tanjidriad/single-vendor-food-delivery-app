  <path d="M200 240 Q180 220 220 200 L240 220 Z" fill="#FAD2C0"/>
  <!-- Right Hand holding cake plate -->
  <path d="M320 240 Q340 200 300 200 L280 220 Z" fill="#FAD2C0"/>

