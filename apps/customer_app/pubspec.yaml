name: customer_app
description: Demo Kitchen — customer food delivery app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  equatable: ^2.0.7
  logger: ^2.5.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  socket_io_client: ^3.0.2
  responsive_framework: ^1.5.1
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^1.2.1
  mapbox_maps_flutter: ^2.24.3
  geolocator: ^14.0.2
  flutter_animate: ^4.5.2
  pinput: ^6.0.2
  lottie: ^3.3.3
  image_picker: ^1.1.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.12.0
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.1.1
  intl_phone_field: ^3.2.0
  country_picker: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/illustrations/
    - assets/images/
    - assets/logos/
