services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: food_delivery_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://food_delivery:food_delivery@postgres:5432/food_delivery?schema=public
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: food_delivery_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery
      POSTGRES_DB: food_delivery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U food_delivery -d food_delivery']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
